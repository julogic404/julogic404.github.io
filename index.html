<!DOCTYPE html>
<html lang="pt">
<head>
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JuLogic 404 — Full Stack & Experience Design Studio</title>
  <meta name="description" content="Portfólio da JuLogic 404: desenvolvimento web, apps Android e design UI/UX. Projetos entregues, serviços e contato.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://julogic404.github.io/">

  <meta property="og:title" content="JuLogic 404 — Portfólio">
  <meta property="og:description" content="Desenvolvimento web, apps Android e UI/UX.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://julogic404.github.io/">
  <meta property="og:image" content="https://julogic404.github.io/julogic_hub.webp">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="JuLogic 404 — Portfólio">
  <meta name="twitter:description" content="Desenvolvimento web, apps Android e UI/UX.">
</head>
  <title>JuLogic 404 · Portfólio</title>
  <style>
     {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;          
      background-color: #0b0d10; 
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    .browser-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      background: #0b0d10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .browser-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #ffffff; 
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.05) inset; 
    }

    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0b0d10;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e0e0e0;
      font-size: 1.2rem;
      letter-spacing: 1px;
      opacity: 1;
      transition: opacity 0.6s ease;
      pointer-events: none;    
      z-index: 10;
    }

    .loading-overlay.hide {
      opacity: 0;
    }


    .no-domain {
      position: absolute;
      bottom: 6px;
      right: 10px;
      font-size: 9px;
      color: rgba(255, 255, 255, 0.15);
      background: transparent;
      user-select: none;
      pointer-events: none;
      z-index: 20;
      letter-spacing: 0.5px;
    }

    .no-domain span {
      display: none;
    }
  </style>
</head>
<body>
  <div class="browser-wrapper">
    <div class="loading-overlay" id="loadingOverlay">
      <span>carregando portfólio…</span>
    </div>

    
    <iframe
      class="browser-frame"
      id="portfolioFrame"
      src="https://julogic-portfolio.vercel.app/"
      title="JuLogic 404 – Full Stack & Experience Design Studio"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowfullscreen
      loading="eager"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>


    <div class="no-domain">
      <span>original: julogic-portfolio.vercel.app</span> 
      JuLogic 404
    </div>
  </div>

  <script>
    (function() {
      const iframe = document.getElementById('portfolioFrame');
      const overlay = document.getElementById('loadingOverlay');

      function hideOverlay() {
        if (overlay) {
          overlay.classList.add('hide');
          setTimeout(() => {
            if (overlay.parentNode) {
              overlay.style.display = 'none';
            }
          }, 800);
        }
      }

      iframe.addEventListener('load', function() {
        setTimeout(hideOverlay, 150);
      });

      setTimeout(() => {
        if (overlay && !overlay.classList.contains('hide')) {
          hideOverlay();
        }
      }, 2500);

      if (iframe.contentWindow && iframe.contentWindow.document.readyState === 'complete') {
        hideOverlay();
      }
    })();
  </script>

</body>
</html>

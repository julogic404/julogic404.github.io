name: Build e publicar docs

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Instalar o Bun
        uses: oven-sh/setup-bun@v2

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Gerar a pasta docs
        run: bun run build:docs

      - name: Publicar alterações em docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "Sem alterações em docs/ — nada a publicar."
            exit 0
          fi
          git commit -m "chore: atualizar docs estáticos [skip ci]"
          git push
